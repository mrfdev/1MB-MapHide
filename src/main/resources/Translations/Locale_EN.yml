prefix: "<dark_gray>[<aqua>MapHide</aqua>]</dark_gray>"

messages:
  bluemap-not-ready: "<prefix> <red>BlueMap is not ready yet. Try again in a moment.</red>"
  usage-map-hide: "<prefix> <yellow>Usage: /map hide</yellow>"
  usage-bmpc: "<prefix> <yellow>Usage: /bmpc [toggle|show|hide], /bmpc <toggle|show|hide|status> <player>, /bmpc config, /bmpc config set <key> <value>, or /bmpc reload</yellow>"
  no-permission: "<prefix> <red>You do not have permission to do that.</red>"
  player-only: "<prefix> <red>Only players can use this command.</red>"
  player-not-found: "<prefix> <yellow>Player \"<player>\" was not found.</yellow>"
  self-visible: "<prefix> <green>You are now visible on the map.</green>"
  self-hidden: "<prefix> <gold>You are now hidden from the map.</gold>"
  target-visible: "<prefix> <green><player> is now visible on the map.</green>"
  target-hidden: "<prefix> <gold><player> is now hidden from the map.</gold>"
  timer-visible: "<prefix> <green>Your timed map hide toggle expired. You are now visible on the map.</green>"
  timer-hidden: "<prefix> <gold>Your timed map hide toggle expired. You are now hidden from the map.</gold>"
  toggle-back-scheduled: "<prefix> <gray>Auto-toggle in <aqua><seconds>s</aqua>. Use <aqua>/map hide</aqua> to reset.</gray>"
  force-hide-active: "<prefix> <gold>Your permissions force you to stay hidden from the map.</gold>"
  force-show-active: "<prefix> <green>Your permissions force you to stay visible on the map.</green>"
  target-forced: "<prefix> <yellow><player> has a forced visibility permission: <mode>.</yellow>"
  reloaded: "<prefix> <green>Configuration and translations reloaded.</green>"
  config-header: "<prefix> <aqua>Current config values:</aqua>"
  config-line: "<gray><key>: <white><value></white></gray>"
  config-updated: "<prefix> <green>Updated <key> to <value>.</green>"
  config-unknown-key: "<prefix> <red>Unknown config key: <key></red>"
  status-server-header: "<prefix> <aqua>Server status</aqua>"
  status-server-plugin: "<gray>Plugin: <aqua>1MB-MapHide <plugin_version></aqua>, target: <aqua>Java <target_java></aqua> / <aqua>Paper <target_paper></aqua></gray>"
  status-server-build: "<gray>Build: <aqua><build_number></aqua></gray>"
  status-server-bluemap: "<gray>BlueMap: <aqua><bluemap_version></aqua>, API: <aqua><bluemap_api></aqua></gray>"
  status-server-runtime: "<gray>Server: <aqua><engine></aqua> MC <aqua><minecraft></aqua> (<server_version>)</gray>"
  status-server-java: "<gray>Java: <aqua><java></aqua>, <vendor>, <vm></gray>"
  status-server-player-usage: "<gray>Use <aqua>/bmpc status <player></aqua> to check a player.</gray>"
  status: "<prefix> <gray><player>: visibility=<aqua><visibility></aqua>, forced=<aqua><forced></aqua>, force_mode=<aqua><force_mode></aqua>, world=<aqua><world></aqua> (<x>, <y>, <z>), timer=<aqua><timer></aqua></gray>"
