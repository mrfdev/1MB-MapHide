plugins {
	id "java"
}

group = "com.onemb"

def pluginVersion = providers.gradleProperty("pluginVersion").get()
def javaTarget = providers.gradleProperty("javaTarget").get().toInteger()
def buildJavaVersion = providers.gradleProperty("buildJavaVersion").get()
def testJavaVersion = providers.gradleProperty("testJavaVersion").get()
def oracleJdks = gradle.ext.oracleJdks
def paperTarget = providers.gradleProperty("paperTarget").get()
def paperApiVersion = providers.gradleProperty("paperApiVersion").get()
def paperBuild = providers.gradleProperty("paperBuild").get().toInteger()
def paperChannel = providers.gradleProperty("paperChannel").get().toUpperCase()
def paperSha256 = providers.gradleProperty("paperSha256").get()
def blueMapApiVersion = providers.gradleProperty("blueMapApiVersion").get()
def placeholderApiVersion = providers.gradleProperty("placeholderApiVersion").get()
version = pluginVersion

def buildNumberFile = file("build-number.txt")
def releaseBuildNumber = new java.util.concurrent.atomic.AtomicReference<String>()
def pinnedBuildNumber = providers.gradleProperty("releaseBuildNumber")

def maintainedServerDirs = [
	file("servers/Paper-26.3")
]

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaTarget)
		vendor = JvmVendorSpec.ORACLE
	}
}

def buildCompiler = javaToolchains.compilerFor {
	languageVersion = JavaLanguageVersion.of(25)
	vendor = JvmVendorSpec.ORACLE
}
def testLauncher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(27)
	vendor = JvmVendorSpec.ORACLE
}
def verifyToolchain = { metadata, expected ->
	if (metadata.languageVersion.asInt() != expected.major
			|| metadata.vendor != "Oracle"
			|| metadata.installationPath.asFile.canonicalPath != expected.home) {
		throw new GradleException("Expected Oracle JDK ${expected.major} at ${expected.home}; selected ${metadata}")
	}
}

tasks.register("verifyBuildJava") {
	group = "verification"
	description = "Verifies Oracle 25 compilers and Oracle 27 test launchers, including exact installed paths."

	doLast {
		tasks.withType(JavaCompile).each { task ->
			verifyToolchain(task.javaCompiler.get().metadata, oracleJdks.build)
			if (task.options.release.get() != 25) {
				throw new GradleException("${task.path} must use --release 25")
			}
		}
		tasks.withType(Test).each { task ->
			verifyToolchain(task.javaLauncher.get().metadata, oracleJdks.test)
			if (task.executable != null && file(task.executable).canonicalPath != oracleJdks.test.java) {
				throw new GradleException("${task.path} must launch ${oracleJdks.test.java}")
			}
		}
		logger.lifecycle("Gradle: ${System.getProperty('java.vendor')} ${System.getProperty('java.runtime.version')} at ${System.getProperty('java.home')}")
		logger.lifecycle("Compiler (all sources, --release 25): ${oracleJdks.build.vendor} ${oracleJdks.build.runtime_version} at ${oracleJdks.build.javac}")
		logger.lifecycle("Tests (all Test tasks): ${oracleJdks.test.vendor} ${oracleJdks.test.runtime_version} at ${oracleJdks.test.java}")
	}
}

tasks.withType(JavaCompile).configureEach {
	dependsOn(tasks.named("verifyBuildJava"))
	javaCompiler = buildCompiler
	javaCompiler.disallowChanges()
	options.encoding = "UTF-8"
	options.release = 25
	options.release.disallowChanges()
	options.compilerArgs.add("-Xlint:deprecation")
}

tasks.withType(Test).configureEach {
	dependsOn(tasks.named("verifyBuildJava"))
	useJUnit()
	javaLauncher = testLauncher
	javaLauncher.disallowChanges()
	environment "JAVA_HOME", oracleJdks.test.home
	environment "PATH", "${oracleJdks.test.home}/bin${File.pathSeparator}${System.getenv('PATH')}"
	systemProperty "oneMb.testJavaHome", oracleJdks.test.home
	testLogging { events "passed", "skipped", "failed" }
}

tasks.register("prepareBuildNumber") {
	group = "build"
	description = "Advances the persistent build number, or reuses -PreleaseBuildNumber for repeatable release builds."
	outputs.upToDateWhen { false }

	doLast {
		int currentBuildNumber = buildNumberFile.isFile() ? buildNumberFile.text.trim().toInteger() : 4
		int nextBuildNumber

		if (pinnedBuildNumber.isPresent()) {
			String requested = pinnedBuildNumber.get()
			if (!(requested ==~ /\d{3}/)) {
				throw new GradleException("releaseBuildNumber must be exactly three digits")
			}
			nextBuildNumber = requested.toInteger()
			if (nextBuildNumber < currentBuildNumber) {
				throw new GradleException("releaseBuildNumber ${requested} is older than current build ${currentBuildNumber}")
			}
			if (nextBuildNumber > currentBuildNumber + 1) {
				throw new GradleException("releaseBuildNumber may advance by at most one")
			}
		} else {
			nextBuildNumber = currentBuildNumber + 1
		}

		if (nextBuildNumber > 999) {
			throw new GradleException("Build number exceeds the three-digit release format")
		}

		releaseBuildNumber.set(String.format("%03d", nextBuildNumber))
		if (nextBuildNumber != currentBuildNumber) {
			buildNumberFile.text = releaseBuildNumber.get() + System.lineSeparator()
		}
		logger.lifecycle("Using build number ${releaseBuildNumber.get()}")
	}
}

def releaseVersion = providers.provider {
	if (releaseBuildNumber.get() == null) {
		throw new GradleException("Build number has not been prepared")
	}
	"${pluginVersion}-${releaseBuildNumber.get()}-j${javaTarget}-${paperTarget}"
}

dependencies {
	compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
	compileOnly "de.bluecolored:bluemap-api:${blueMapApiVersion}"
	compileOnly "me.clip:placeholderapi:${placeholderApiVersion}"
	testImplementation "junit:junit:4.13.2"
}

tasks.processResources {
	dependsOn(tasks.named("prepareBuildNumber"))
	inputs.property("version", releaseVersion)
	inputs.property("pluginVersion", pluginVersion)
	inputs.property("javaTarget", javaTarget)
	inputs.property("paperTarget", paperTarget)
	inputs.property("paperApiVersion", paperApiVersion)
	inputs.property("paperBuild", paperBuild)
	inputs.property("paperChannel", paperChannel)
	filesMatching("plugin.yml") {
		expand(
				version: pluginVersion,
				paperTarget: paperTarget
		)
	}
	filesMatching("build-info.properties") {
		expand(
				version: pluginVersion,
				pluginVersion: pluginVersion,
				buildNumber: releaseBuildNumber.get(),
				javaTarget: javaTarget,
				paperTarget: paperTarget,
				paperApiVersion: paperApiVersion,
				paperBuild: paperBuild,
				paperChannel: paperChannel
		)
	}
}

tasks.jar {
	dependsOn(tasks.named("prepareBuildNumber"))
	archiveFileName = providers.provider {
		"1MB-BlueMap-MapHide-v${releaseVersion.get()}.jar"
	}
}

tasks.register("verifyReleaseMetadata") {
	group = "verification"
	description = "Fails when release metadata, documentation, or target declarations drift."
	dependsOn(tasks.named("prepareBuildNumber"))

	doLast {
		String buildNumber = releaseBuildNumber.get()
		String expectedPaperApi = "${paperTarget}.build.${paperBuild}-${paperChannel.toLowerCase()}"
		String expectedJar = "1MB-BlueMap-MapHide-v${pluginVersion}-${buildNumber}-j${javaTarget}-${paperTarget}.jar"

		if (!(pluginVersion ==~ /\d+\.\d+\.\d+/)) {
			throw new GradleException("pluginVersion must use semantic x.y.z format")
		}
		if (!(buildNumber ==~ /\d{3}/)) {
			throw new GradleException("build number must use exactly three digits")
		}
		if (paperApiVersion != expectedPaperApi) {
			throw new GradleException("paperApiVersion ${paperApiVersion} does not match ${expectedPaperApi}")
		}
		if (!(paperChannel in ["STABLE", "BETA", "ALPHA"])) {
			throw new GradleException("Paper release channel must explicitly select STABLE, BETA, or ALPHA")
		}
		if (!(paperSha256 ==~ /[0-9a-f]{64}/)) {
			throw new GradleException("paperSha256 must pin the official server download checksum")
		}

		File readme = file("README.md")
		File installation = file("docs/installation.md")
		File integrations = file("docs/integrations.md")
		File docsMetadata = file("docs/plugin-docs.yml")
		File workflow = file(".github/workflows/main.yml")
		File pluginMetadata = file("src/main/resources/plugin.yml")
		File buildInfoTemplate = file("src/main/resources/build-info.properties")
		String documentation = ([readme, installation, integrations] + fileTree("docs") {
			include "*.md"
		}).unique().collect { it.text }.join(System.lineSeparator())

		[
			(readme): [
				"Version `${pluginVersion}`",
				"JDK ${buildJavaVersion}",
				"JDK ${testJavaVersion}",
				expectedJar,
				"`io.papermc.paper:paper-api:${paperApiVersion}`",
				"`de.bluecolored:bluemap-api:${blueMapApiVersion}`",
				"`me.clip:placeholderapi:${placeholderApiVersion}`"
			],
			(installation): [
				"JDK ${buildJavaVersion}",
				"JDK ${testJavaVersion}",
				"1MB-BlueMap-MapHide-v${pluginVersion}-<build>-j${javaTarget}-${paperTarget}.jar",
				"`io.papermc.paper:paper-api:${paperApiVersion}`",
				"`de.bluecolored:bluemap-api:${blueMapApiVersion}`",
				"`me.clip:placeholderapi:${placeholderApiVersion}`"
			],
			(integrations): [
				"Paper ${paperTarget}",
				"build ${paperBuild} ${paperChannel.toLowerCase()}",
				"`de.bluecolored:bluemap-api:${blueMapApiVersion}`",
				"`me.clip:placeholderapi:${placeholderApiVersion}`"
			],
			(docsMetadata): [
				"java_target: ${javaTarget}",
				"paper_target: ${paperTarget}"
			],
			(workflow): [
				"java-version: '${buildJavaVersion}'",
				"java-version: '${testJavaVersion}'",
				"./build.sh --no-daemon",
				"ONE_MB_BUILD_JAVA_HOME:",
				"ONE_MB_TEST_JAVA_HOME:"
			],
			(pluginMetadata): [
				"version: '\${version}'",
				"api-version: '\${paperTarget}'"
			],
			(buildInfoTemplate): [
				"paperApiVersion=\${paperApiVersion}",
				"paperBuild=\${paperBuild}",
				"paperChannel=\${paperChannel}"
			]
		].each { File target, List<String> expectedValues ->
			expectedValues.each { String expectedValue ->
				if (!target.text.contains(expectedValue)) {
					throw new GradleException("${target} is missing release metadata: ${expectedValue}")
				}
			}
		}

		def jarMatcher = documentation =~ /1MB-BlueMap-MapHide-v(\d+\.\d+\.\d+)-(\d{3})-j(\d+)-([0-9.]+)\.jar/
		while (jarMatcher.find()) {
			if (jarMatcher.group(0) != expectedJar) {
				throw new GradleException("Stale documented jar name: ${jarMatcher.group(0)}; expected ${expectedJar}")
			}
		}

		def releaseMatcher = documentation =~ /Version `(\d+\.\d+\.\d+)`/
		while (releaseMatcher.find()) {
			if (releaseMatcher.group(1) != pluginVersion) {
				throw new GradleException("Stale documented semantic version: ${releaseMatcher.group(1)}")
			}
		}
	}
}

tasks.register("verifyArtifactMetadata") {
	group = "verification"
	description = "Checks generated plugin metadata and Java bytecode in the release jar."
	dependsOn(tasks.jar)

	doLast {
		String buildNumber = releaseBuildNumber.get()
		File artifact = tasks.jar.archiveFile.get().asFile
		String expectedName = "1MB-BlueMap-MapHide-v${pluginVersion}-${buildNumber}-j${javaTarget}-${paperTarget}.jar"
		if (artifact.name != expectedName) {
			throw new GradleException("Unexpected artifact name ${artifact.name}; expected ${expectedName}")
		}

		def zip = new java.util.zip.ZipFile(artifact)
		try {
			Properties buildInfo = new Properties()
			buildInfo.load(zip.getInputStream(zip.getEntry("build-info.properties")))
			[
					version: pluginVersion,
					pluginVersion: pluginVersion,
					buildNumber: buildNumber,
					javaTarget: javaTarget.toString(),
					paperTarget: paperTarget,
					paperApiVersion: paperApiVersion,
					paperBuild: paperBuild.toString(),
					paperChannel: paperChannel
			].each { String key, String expectedValue ->
				if (buildInfo.getProperty(key) != expectedValue) {
					throw new GradleException("Artifact ${key}=${buildInfo.getProperty(key)}; expected ${expectedValue}")
				}
			}

			String pluginYml = zip.getInputStream(zip.getEntry("plugin.yml")).getText("UTF-8")
			if (!pluginYml.contains("version: '${pluginVersion}'")
					|| !pluginYml.contains("api-version: '${paperTarget}'")) {
				throw new GradleException("Generated plugin.yml metadata is stale")
			}

			int expectedClassMajorVersion = 44 + javaTarget
			if (zip.getEntry("com/technicjelle/bluemapplayercontrol/BlueMapPlayerControl.class") == null) {
				throw new GradleException("Artifact is missing the plugin main class")
			}
			def classes = zip.entries().findAll { it.name.endsWith(".class") }
			if (classes.isEmpty()) {
				throw new GradleException("Artifact contains no Java classes")
			}
			classes.each { entry ->
				byte[] bytecode = zip.getInputStream(entry).readAllBytes()
				int minor = ((bytecode[4] & 0xff) << 8) | (bytecode[5] & 0xff)
				int major = ((bytecode[6] & 0xff) << 8) | (bytecode[7] & 0xff)
				if (major != expectedClassMajorVersion || minor != 0) {
					throw new GradleException("${entry.name} has class version ${major}.${minor}; expected ${expectedClassMajorVersion}.0 without preview features")
				}
			}
			logger.lifecycle("Verified ${classes.size()} Java ${javaTarget} classes without preview features")
		} finally {
			zip.close()
		}
	}
}

tasks.register("verifyLocalPaperServer") {
	group = "verification"
	description = "Checks the maintained local PaperScript config, Paper build, and saved SHA-256."

	doLast {
		File serverDir = file(providers.gradleProperty("localPaperServerDir").getOrElse("servers/Paper-26.3"))
		File configFile = new File(serverDir, "paperscript/config.json")
		File stateFile = new File(serverDir, "paperscript/state.json")
		if (!configFile.isFile() || !stateFile.isFile()) {
			logger.lifecycle("Skipping local Paper server verification: PaperScript state is not present")
			return
		}

		def parser = new groovy.json.JsonSlurper()
		Map config = parser.parse(configFile) as Map
		Map state = parser.parse(stateFile) as Map
		if (config.default_channel?.toString()?.toUpperCase() != paperChannel
				|| config.check_latest_channel_only?.toString()?.toUpperCase() != paperChannel
				|| config.allow_same_version_build_upgrade != true
				|| (config.containsKey("download_filename_pattern")
						&& config.download_filename_pattern != "Paper-{version}.jar")) {
			throw new GradleException("Maintained PaperScript config does not match the explicit ${paperChannel} release channel")
		}
		if (state.current_version != paperTarget || state.current_build.toString().toInteger() != paperBuild) {
			throw new GradleException("Maintained Paper server is not ${paperTarget} build ${paperBuild}")
		}
		if (state.current_channel != paperChannel || file(state.server_dir.toString()).canonicalFile != serverDir.canonicalFile) {
			throw new GradleException("Maintained Paper state has a stale channel or server directory")
		}

		File paperJar = new File(serverDir, state.current_jar.toString())
		if (!paperJar.isFile()) {
			throw new GradleException("Maintained Paper jar is missing: ${paperJar}")
		}
		String actualSha256 = java.security.MessageDigest.getInstance("SHA-256")
				.digest(paperJar.bytes)
				.collect { String.format("%02x", it & 0xff) }
				.join()
		if (actualSha256 != state.current_sha256 || actualSha256 != paperSha256) {
			throw new GradleException("Maintained Paper jar SHA-256 does not match PaperScript state and the pinned official checksum")
		}
		// Newer PaperScript records expected_sha256 for a staged upgrade, not the current jar.
		if (state.staged_jar) {
			File stagedJar = new File(serverDir, state.staged_jar.toString())
			if (!stagedJar.isFile()) {
				throw new GradleException("Staged Paper jar is missing: ${stagedJar}")
			}
			String stagedSha256 = java.security.MessageDigest.getInstance("SHA-256")
					.digest(stagedJar.bytes).collect { String.format("%02x", it & 0xff) }.join()
			if (stagedSha256 != state.staged_sha256 || stagedSha256 != state.expected_sha256) {
				throw new GradleException("Staged Paper jar SHA-256 does not match PaperScript state")
			}
			logger.lifecycle("Verified separately staged ${stagedJar.name}; release tests still use ${paperJar.name}")
		} else if (actualSha256 != state.expected_sha256) {
			throw new GradleException("Maintained Paper jar SHA-256 does not match the expected download checksum")
		}
		logger.lifecycle("Verified Paper ${paperTarget} build ${paperBuild} ${paperChannel}: ${paperJar}")
	}
}

tasks.register("testVerificationScripts", Exec) {
	group = "verification"
	description = "Tests Java toolchain selection and verification helpers."
	commandLine "python3", "-m", "unittest", "discover", "-s", "scripts/tests", "-v"
}

tasks.register("deployServers") {
	group = "build"
	description = "Copies the built jar into the maintained Paper 26.3 plugins folder and disables older active copies."
	dependsOn(tasks.jar)

	doLast {
		File builtJar = tasks.jar.archiveFile.get().asFile
		maintainedServerDirs.each { File serverDir ->
			if (new File(serverDir, "paperscript/locks/server-launch").exists()) {
				throw new GradleException("Stop the maintained launcher before deploying: ${serverDir}")
			}
			File pluginsDir = new File(serverDir, "plugins")
			if (!pluginsDir.isDirectory()) {
				logger.lifecycle("Skipping ${pluginsDir}: directory does not exist")
				return
			}

			File[] oldJars = pluginsDir.listFiles({ File file ->
				file.isFile()
						&& file.name.endsWith(".jar")
						&& (file.name.startsWith("1MB-BlueMap-MapHide-")
								|| file.name.startsWith("1MB-MapHide-")
								|| file.name.startsWith("BlueMapPlayerControl-"))
			} as FileFilter) ?: []

			oldJars.each { File oldJar ->
				File disabled = new File(oldJar.parentFile, oldJar.name + ".disabled")
				int suffix = 1
				while (disabled.exists()) {
					disabled = new File(oldJar.parentFile, oldJar.name + ".disabled." + suffix++)
				}
				if (!oldJar.renameTo(disabled)) {
					throw new GradleException("Could not disable old jar: ${oldJar}")
				}
				logger.lifecycle("Disabled ${oldJar.name} in ${pluginsDir}")
			}

			copy {
				from builtJar
				into pluginsDir
			}
			logger.lifecycle("Deployed ${builtJar.name} to ${pluginsDir}")
		}
	}
}

tasks.named("check") {
	dependsOn(tasks.named("testVerificationScripts"))
	dependsOn(tasks.named("verifyBuildJava"))
	dependsOn(tasks.named("verifyReleaseMetadata"))
	dependsOn(tasks.named("verifyArtifactMetadata"))
}

tasks.named("deployServers") {
	mustRunAfter(tasks.named("check"))
}

tasks.named("build") {
	dependsOn(tasks.named("deployServers"))
}
